<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — {{ business_name or "AGAN VENDHAN WEIGH BRIDGE" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 p-7 sm:p-9 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white text-2xl shadow-lg">
                <i class="fa-solid fa-truck-moving"></i>
            </div>
            <h1 class="text-xl font-black text-slate-900 uppercase tracking-tight">
                {{ business_name or "AGAN VENDHAN WEIGH BRIDGE" }}
            </h1>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                Authorized Portal Access &bull; பாதுகாப்பான உள்நுழைவு
            </p>
        </div>

        {% if error %}
        <div class="p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs font-bold flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <input type="hidden" name="next" value="{{ next_url or '/' }}">

            <div>
                <label for="username" class="block text-xs font-black uppercase tracking-wider text-slate-700 mb-1.5">
                    Username / பயனர் பெயர்
                </label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-400"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username"
                           placeholder="Enter username (e.g. admin)"
                           class="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 outline-none text-sm font-bold text-slate-900">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-black uppercase tracking-wider text-slate-700 mb-1.5">
                    Password / கடவுச்சொல்
                </label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           placeholder="Enter password"
                           class="w-full pl-10 pr-11 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 outline-none text-sm font-bold text-slate-900">
                    <button type="button" onclick="togglePw()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-700 p-1">
                        <i id="pwEye" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-black text-sm shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Sign In / உள்நுழைக</span>
            </button>
        </form>

        <div class="pt-3 border-t border-slate-100 text-center text-[11px] text-slate-400 font-medium">
            PBKDF2-SHA256 Encrypted Authentication &bull; Cloud v1.0
        </div>
    </div>

    <script>
        function togglePw() {
            const inp = document.getElementById('password');
            const eye = document.getElementById('pwEye');
            if (inp.type === 'password') {
                inp.type = 'text';
                eye.className = 'fa-solid fa-eye-slash';
            } else {
                inp.type = 'password';
                eye.className = 'fa-solid fa-eye';
            }
        }
    </script>
</body>
</html>
